<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Mais que um pet shop. Um lugar de confiança.</title>
  <desc id="desc">Arte-conceito para a Vet Prime com uma profissional cuidando de um cachorro em um ambiente acolhedor.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#eefbf6"/></linearGradient>
    <linearGradient id="photoShade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#102a31" stop-opacity=".03"/><stop offset="1" stop-color="#102a31" stop-opacity=".45"/></linearGradient>
    <clipPath id="photoClip"><rect x="935" y="120" width="515" height="750" rx="38"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#102a31" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1600" height="1100" fill="url(#paper)"/>
  <circle cx="1370" cy="185" r="190" fill="#ffd433" opacity=".9"/>
  <circle cx="1115" cy="935" r="220" fill="#18b9c8" opacity=".9"/>
  <text x="150" y="180" fill="#087d91" font-family="Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="6">UM LUGAR PARA ELES</text>
  <text x="150" y="330" fill="#152229" font-family="Arial, sans-serif" font-size="108" font-weight="900" letter-spacing="-5">MAIS QUE</text>
  <text x="150" y="440" fill="#152229" font-family="Arial, sans-serif" font-size="108" font-weight="900" letter-spacing="-5">UM PET</text>
  <text x="150" y="550" fill="#152229" font-family="Arial, sans-serif" font-size="108" font-weight="900" letter-spacing="-5">SHOP.</text>
  <text x="150" y="680" fill="#087d91" font-family="Georgia, serif" font-size="92" font-style="italic">Um lugar de</text>
  <text x="150" y="770" fill="#087d91" font-family="Georgia, serif" font-size="92" font-style="italic">confiança.</text>
  <text x="150" y="855" fill="#63777b" font-family="Arial, sans-serif" font-size="22">Cuidado próximo, orientação sincera</text>
  <text x="150" y="890" fill="#63777b" font-family="Arial, sans-serif" font-size="22">e tudo o que seu pet precisa para viver bem.</text>
  <g filter="url(#shadow)">
    <rect x="935" y="120" width="515" height="750" rx="38" fill="#d7e8e5"/>
    <g clip-path="url(#photoClip)">
      <image x="935" y="120" width="515" height="750" preserveAspectRatio="xMidYMid slice" xlink:href="https://images.unsplash.com/photo-1583337130417-3346a1be7dee?auto=format&amp;fit=crop&amp;w=1200&amp;q=90"/>
      <rect x="935" y="120" width="515" height="750" fill="url(#photoShade)"/>
    </g>
    <rect x="975" y="720" width="260" height="82" rx="41" fill="#ffd433"/>
    <text x="1020" y="770" fill="#102a31" font-family="Arial, sans-serif" font-size="18" font-weight="800">CUIDADO DE VERDADE</text>
  </g>
  <text x="1390" y="950" fill="#102a31" font-family="Arial, sans-serif" font-size="18" font-weight="800" text-anchor="end" letter-spacing="3">VET PRIME · BOQUEIRÃO</text>
</svg>
